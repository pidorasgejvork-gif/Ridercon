<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Rider v2</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-family: monospace; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div style="font-size: 24px; font-weight: bold;">SCORE: <span id="score">0</span></div>
        <div style="font-size: 16px; color: #aaa;">DIST: <span id="dist">0</span>m</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- Настройки физики ---
const GRAVITY = 0.4;
const ENGINE_FORCE = 0.3;
const MAX_SPEED = 15;
const FRICTION = 0.99;

// --- Состояние игры ---
let gameState = 'playing';
let camera = { x: 0, y: 0 };
let score = 0;
let distance = 0;

// --- Трасса ---
let trackPoints = [];
let segmentLength = 150;

// --- Байк ---
const bike = {
    x: 0, 
    y: 0,
    vx: 5,
    vy: 0,
    angle: 0,
    width: 50,
    height: 25,
    wheelRadius: 8
};

// --- Генерация трассы ---
function generateTrack(startX, startY) {
    let currentX = startX;
    let currentY = startY;
    let angle = 0;

    for (let i = 0; i < 50; i++) {
        angle += (Math.random() - 0.5) * 15; 
        angle = Math.max(-30, Math.min(30, angle));
        
        const rad = angle * Math.PI / 180;
        const nextX = currentX + Math.cos(rad) * segmentLength;
        const nextY = currentY + Math.sin(rad) * segmentLength;
        
        trackPoints.push({ x: currentX, y: currentY });
        currentX = nextX;
        currentY = nextY;
    }
}

// Инициализация трассы
generateTrack(0, canvas.height * 0.7);

// Позиция байка на старте (на первом сегменте)
bike.x = trackPoints[0].x;
bike.y = trackPoints[0].y - 20;

// --- Управление ---
let keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('touchstart', () => keys['Space'] = true);
window.addEventListener('touchend', () => keys['Space'] = false);

// --- Физика ---
function update() {
    if (gameState !== 'playing') return;

    // 1. Гравитация
    bike.vy += GRAVITY;

    // 2. Управление (Газ)
    if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
        // Ускорение вдоль оси байка
        bike.vx += Math.cos(bike.angle) * ENGINE_FORCE;
        bike.vy += Math.sin(bike.angle) * ENGINE_FORCE;
    }

    // Ограничение скорости
    const speed = Math.sqrt(bike.vx*bike.vx + bike.vy*bike.vy);
    if (speed > MAX_SPEED) {
        bike.vx = (bike.vx / speed) * MAX_SPEED;
        bike.vy = (bike.vy / speed) * MAX_SPEED;
    }

    // 3. Обновление позиции
    bike.x += bike.vx;
    bike.y += bike.vy;

    // 4. Коллизия с трассой (проверка двух колёс)
    let onGround = false;
    
    // Точки колёс (заднее и переднее)
    const wheel1 = { 
        x: bike.x - Math.cos(bike.angle) * (bike.width/2) + Math.sin(bike.angle) * (bike.height/2),
        y: bike.y - Math.sin(bike.angle) * (bike.width/2) - Math.cos(bike.angle) * (bike.height/2)
    };
    const wheel2 = { 
        x: bike.x + Math.cos(bike.angle) * (bike.width/2) + Math.sin(bike.angle) * (bike.height/2),
        y: bike.y + Math.sin(bike.angle) * (bike.width/2) - Math.cos(bike.angle) * (bike.height/2)
    };

    // Проверка пересечения колёс с линиями трассы
    for (let i = 0; i < trackPoints.length - 1; i++) {
        const p1 = trackPoints[i];
        const p2 = trackPoints[i+1];
        
        // Упрощенная проверка: если колесо ниже линии, "выталкиваем" его
        const lineY = p1.y + (p2.y - p1.y) * ((wheel1.x - p1.x) / (p2.x - p1.x));
        
        if (wheel1.x > p1.x && wheel1.x < p2.x && wheel1.y > lineY) {
            bike.y -= (wheel1.y - lineY);
            // Гасим вертикальную скорость при касании
            if (bike.vy > 0) bike.vy *= 0.5;
            onGround = true;
            
            // Угол байка подстраивается под наклон трассы
            const trackAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            bike.angle += (trackAngle - bike.angle) * 0.1;
        }
    }

    // 5. Камера следует за байком
    camera.x += (bike.x - camera.x - canvas.width * 0.3) * 0.1;
    camera.y += (bike.y - camera.y - canvas.height * 0.5) * 0.1;

    // 6. Досоздание трассы
    if (bike.x > trackPoints[trackPoints.length - 1].x - canvas.width) {
        const last = trackPoints[trackPoints.length - 1];
        let angle = (Math.random() - 0.5) * 20;
        const rad = angle * Math.PI / 180;
        trackPoints.push({
            x: last.x + Math.cos(rad) * segmentLength,
            y: last.y + Math.sin(rad) * segmentLength
        });
        
        // Удаляем старые точки
        if (trackPoints.length > 100) trackPoints.shift();
    }

    // 7. Счёт
    distance = Math.max(distance, bike.x);
    score = Math.floor(distance / 100);
    document.getElementById('score').innerText = score;
    document.getElementById('dist').innerText = Math.floor(distance/10);

    // 8. Проверка на проигрыш (падение)
    if (bike.y > camera.y + canvas.height) {
        gameState = 'gameover';
    }
}

function draw() {
    // Очистка
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- Трасса ---
    ctx.strokeStyle = '#f0f';
    ctx.lineWidth = 5;
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#f0f';
    ctx.lineJoin = 'round';
    ctx.beginPath();

    let first = true;
    for (let i = 0; i < trackPoints.length; i++) {
        const p = trackPoints[i];
        const screenX = p.x - camera.x;
        const screenY = p.y - camera.y;

        if (screenX < -canvas.width || screenX > canvas.width * 2) continue;

        if (first) {
            ctx.moveTo(screenX, screenY);
            first = false;
        } else {
            ctx.lineTo(screenX, screenY);
        }
    }
    ctx.stroke();

    // --- Байк ---
    ctx.save();
    ctx.translate(bike.x - camera.x, bike.y - camera.y);
    ctx.rotate(bike.angle);

    // Корпус
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0ff';
    ctx.fillRect(-bike.width/2, -bike.height/2, bike.width, bike.height);

    // Колёса
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.arc(-bike.width/2 + 10, bike.height/2, bike.wheelRadius, 0, Math.PI*2);
    ctx.arc(bike.width/2 - 10, bike.height/2, bike.wheelRadius, 0, Math.PI*2);
    ctx.fill();

    // Следы от колёс (пыль)
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(-bike.width/2 + 10, bike.height/2, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // --- Game Over ---
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f0f';
        ctx.font = 'bold 40px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.font = '20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Нажми R для рестарта', canvas.width/2, canvas.height/2 + 40);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// Рестарт
window.addEventListener('keydown', e => {
    if (e.code === 'KeyR' && gameState === 'gameover') {
        location.reload();
    }
});

// Запуск
loop();
</script>
</body>
</html>
