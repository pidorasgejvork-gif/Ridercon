<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Rider v5</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-family: monospace; pointer-events: none; text-shadow: 0 0 10px #0ff; }
        #coins-ui { color: #ffd700; font-size: 24px; font-weight: bold; margin-top: 5px; text-shadow: 0 0 10px #ffd700; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div style="font-size: 32px; font-weight: bold; color: #0ff;">SCORE: <span id="score">0</span></div>
        <div id="coins-ui">🪙 <span id="coins">0</span></div>
        <div style="font-size: 18px; color: #0f0;">DIST: <span id="dist">0</span>m</div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- Звуки (Web Audio API) ---
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playCoinSound() {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    // Восходящий звук (как "дзынь")
    osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
    osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1); // E6
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

// --- Настройки физики (улучшенные) ---
const GRAVITY = 0.6; // Чуть сильнее гравитация для стабильности
const ENGINE_FORCE = 0.8; // Ускорение
const MAX_SPEED = 20;
const ANGLE_SMOOTHING = 0.15; // Плавность поворота

let gameState = 'playing';
let camera = { x: 0, y: 0 };
let score = 0;
let distance = 0;
let coinsCollected = 0;

let trackPoints = [];
let segmentLength = 120;
let coins = [];

const bike = {
    x: 0, 
    y: 0,
    vx: 10,
    vy: 0,
    angle: 0,
    width: 55,
    height: 20,
    wheelBase: 35,
    wheelRadius: 9
};

let trailParticles = [];

function generateTrack(startX, startY) {
    let currentX = startX;
    let currentY = startY;
    let angle = 0;

    for (let i = 0; i < 50; i++) {
        // Делаем горки более плавными
        angle += (Math.random() - 0.5) * 15; 
        angle = Math.max(-30, Math.min(30, angle));
        
        const rad = angle * Math.PI / 180;
        const nextX = currentX + Math.cos(rad) * segmentLength;
        const nextY = currentY + Math.sin(rad) * segmentLength;
        
        trackPoints.push({ x: currentX, y: currentY });
        currentX = nextX;
        currentY = nextY;

        // Генерация монеток (50% шанс на сегмент)
        if (Math.random() < 0.5) {
            const t = Math.random() * 0.8 + 0.1; // Позиция на сегменте (от 10% до 90%)
            const coinX = currentX - Math.cos(rad) * segmentLength * (1-t);
            const coinY = currentY - Math.sin(rad) * segmentLength * (1-t) - 40; // Парим над трассой
            coins.push({ x: coinX, y: coinY, collected: false, size: 12 });
        }
    }
}

generateTrack(0, canvas.height * 0.6);
bike.x = trackPoints[0].x + 100;
bike.y = trackPoints[1].y - 30;

// --- Управление ---
let keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('touchstart', (e) => { e.preventDefault(); keys['Space'] = true; }, {passive: false});
window.addEventListener('touchend', (e) => { e.preventDefault(); keys['Space'] = false; }, {passive: false});

// --- Физика ---
function update() {
    if (gameState !== 'playing') return;

    // Гравитация
    bike.vy += GRAVITY;

    // Управление
    if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
        bike.vx += Math.cos(bike.angle) * ENGINE_FORCE;
        bike.vy += Math.sin(bike.angle) * ENGINE_FORCE;
    } else {
        // Плавное трение
        bike.vx *= 0.99;
    }

    // Ограничение скорости
    const speed = Math.sqrt(bike.vx*bike.vx + bike.vy*bike.vy);
    if (speed > MAX_SPEED) {
        bike.vx = (bike.vx / speed) * MAX_SPEED;
        bike.vy = (bike.vy / speed) * MAX_SPEED;
    }

    bike.x += bike.vx;
    bike.y += bike.vy;

    // Коллизия
    let onGround = false;
    let groundAngle = bike.angle;
    
    // Точки колес
    const rx = bike.x - Math.cos(bike.angle) * (bike.wheelBase/2);
    const ry = bike.y - Math.sin(bike.angle) * (bike.wheelBase/2) + bike.height/2;
    const fx = bike.x + Math.cos(bike.angle) * (bike.wheelBase/2);
    const fy = bike.y + Math.sin(bike.angle) * (bike.wheelBase/2) + bike.height/2;

    let closestDist = Infinity;
    let hitPoint = null;

    for (let i = 0; i < trackPoints.length - 1; i++) {
        const p1 = trackPoints[i];
        const p2 = trackPoints[i+1];
        
        if (fx > p1.x && fx < p2.x) {
            const lineY = p1.y + (p2.y - p1.y) * ((fx - p1.x) / (p2.x - p1.x));
            if (fy > lineY - bike.wheelRadius) { 
                const d = fy - lineY;
                if (d < closestDist) {
                    closestDist = d;
                    hitPoint = { x: fx, y: lineY, seg: p1, nextSeg: p2 };
                    onGround = true;
                }
            }
        }
        if (rx > p1.x && rx < p2.x) {
            const lineY = p1.y + (p2.y - p1.y) * ((rx - p1.x) / (p2.x - p1.x));
            if (ry > lineY - bike.wheelRadius) {
                const d = ry - lineY;
                if (d < closestDist) {
                    closestDist = d;
                    hitPoint = { x: rx, y: lineY, seg: p1, nextSeg: p2 };
                    onGround = true;
                }
            }
        }
    }

    if (onGround && hitPoint) {
        // Выталкиваем наверх (мягко)
        bike.y -= closestDist - bike.wheelRadius;
        if (bike.vy > 0) bike.vy *= 0.5; // Гасим удар, но не полностью
        
        // Плавный наклон
        const targetAngle = Math.atan2(hitPoint.nextSeg.y - hitPoint.seg.y, hitPoint.nextSeg.x - hitPoint.seg.x);
        bike.angle += (targetAngle - bike.angle) * ANGLE_SMOOTHING;

        // Следы
        if (Math.random() < 0.3) {
            trailParticles.push({
                x: rx + camera.x,
                y: ry + camera.y,
                life: 1,
                color: '#0ff'
            });
        }
    } else {
        // В воздухе — плавный поворот
        bike.angle += bike.vx * 0.003;
    }

    // Сбор монеток
    for (let coin of coins) {
        if (coin.collected) continue;
        const dist = Math.hypot((bike.x - coin.x), (bike.y - coin.y));
        if (dist < bike.width/2 + coin.size) {
            coin.collected = true;
            coinsCollected++;
            playCoinSound(); // Звук!
            document.getElementById('coins').innerText = coinsCollected;
            
            // Эффект вспышки при сборе
            for (let i = 0; i < 5; i++) {
                trailParticles.push({
                    x: coin.x + camera.x,
                    y: coin.y + camera.y,
                    life: 1,
                    color: '#ffd700'
                });
            }
        }
    }

    // Обновление частиц
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        trailParticles[i].life -= 0.03;
        if (trailParticles[i].life <= 0) trailParticles.splice(i, 1);
    }

    // Камера
    const targetCamX = bike.x - canvas.width * 0.35;
    const targetCamY = bike.y - canvas.height * 0.55;
    camera.x += (targetCamX - camera.x) * 0.12;
    camera.y += (targetCamY - camera.y) * 0.12;

    // Генерация новой трассы и монет
    if (bike.x > trackPoints[trackPoints.length - 1].x - canvas.width) {
        const last = trackPoints[trackPoints.length - 1];
        const prev = trackPoints[trackPoints.length - 2];
        let angle = Math.atan2(last.y - prev.y, last.x - prev.x) * 180 / Math.PI;
        angle += (Math.random() - 0.5) * 20;
        angle = Math.max(-30, Math.min(30, angle));
        
        const rad = angle * Math.PI / 180;
        trackPoints.push({
            x: last.x + Math.cos(rad) * segmentLength,
            y: last.y + Math.sin(rad) * segmentLength
        });

        // Спавн монет на новых сегментах
        if (Math.random() < 0.6) {
            const t = Math.random() * 0.8 + 0.1;
            const coinX = last.x + Math.cos(rad) * segmentLength * t;
            const coinY = last.y + Math.sin(rad) * segmentLength * t - 40;
            coins.push({ x: coinX, y: coinY, collected: false, size: 12 });
        }
        
        if (trackPoints.length > 100) trackPoints.shift();
        // Удаляем старые монеты
        coins = coins.filter(c => c.x > camera.x - 100);
    }

    // Счёт
    distance = Math.max(distance, bike.x);
    score = Math.floor(distance / 50);
    document.getElementById('score').innerText = score;
    document.getElementById('dist').innerText = Math.floor(distance/10);

    // Проигрыш
    if (bike.y > camera.y + canvas.height + 200) {
        gameState = 'gameover';
    }
}

function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- Трасса (Новый цвет: Ярко-зеленый неон) ---
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    
    // Подложка
    ctx.strokeStyle = 'rgba(0, 255, 100, 0.15)';
    ctx.lineWidth = 40;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i < trackPoints.length; i++) {
        const p = trackPoints[i];
        const sx = p.x - camera.x;
        const sy = p.y - camera.y;
        if (sx < -canvas.width || sx > canvas.width * 2) continue;
        if (first) { ctx.moveTo(sx, sy); first = false; } else { ctx.lineTo(sx, sy); }
    }
    ctx.stroke();

    // Линия
    ctx.strokeStyle = '#0f0'; // Зеленый
    ctx.lineWidth = 4;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0f0';
    ctx.beginPath();
    first = true;
    for (let i = 0; i < trackPoints.length; i++) {
        const p = trackPoints[i];
        const sx = p.x - camera.x;
        const sy = p.y - camera.y;
        if (sx < -canvas.width || sx > canvas.width * 2) continue;
        if (first) { ctx.moveTo(sx, sy); first = false; } else { ctx.lineTo(sx, sy); }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // --- Монетки ---
    for (let coin of coins) {
        if (coin.collected) continue;
        const sx = coin.x - camera.x;
        const sy = coin.y - camera.y;
        if (sx < -50 || sx > canvas.width + 50) continue;

        // Свечение
        ctx.fillStyle = '#ffd700';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(sx, sy, coin.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Внутренний блик
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(sx - 3, sy - 3, coin.size / 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // --- Частицы ---
    for (let p of trailParticles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, 3 * p.life, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // --- Байк ---
    ctx.save();
    ctx.translate(bike.x - camera.x, bike.y - camera.y + bike.wheelRadius);
    ctx.rotate(bike.angle);

    // Тень
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 30, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Корпус
    ctx.beginPath();
    ctx.moveTo(-bike.wheelBase/2, 0);
    ctx.lineTo(bike.wheelBase/2, 0);
    ctx.lineTo(bike.wheelBase/2 - 5, -bike.height);
    ctx.lineTo(-bike.wheelBase/2 + 5, -bike.height);
    ctx.closePath();
    
    ctx.fillStyle = '#0ff'; // Голубой байк
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0ff';
    ctx.fill();

    // Колёса
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.arc(-bike.wheelBase/2, 0, bike.wheelRadius, 0, Math.PI*2);
    ctx.arc(bike.wheelBase/2, 0, bike.wheelRadius, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // --- UI ---
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f0f';
        ctx.font = 'bold 50px monospace';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#f0f';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.shadowBlur = 0;
        ctx.font = '20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Нажми R для рестарта', canvas.width/2, canvas.height/2 + 50);
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`Собрано монет: ${coinsCollected}`, canvas.width/2, canvas.height/2 + 90);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
    if (e.code === 'KeyR' && gameState === 'gameover') {
        location.reload();
    }
});

loop();
</script>
</body>
</html>
